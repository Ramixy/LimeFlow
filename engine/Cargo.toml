[package]
name = "lfengine"
version = "1.0.0"
edition = "2021"
description = "LimeFlow DPI bypass engine: Rust port of the LimeFlow ByeDPI fork plus tun2proxy"
license = "GPL-3.0"

[lib]
name = "lfengine"
crate-type = ["cdylib", "rlib"]

# Pure protocol logic (params, packets) builds everywhere, so its unit tests
# run on the Windows host; the socket engine is Linux/Android only.
[dependencies]
rand = "0.8"
once_cell = "1"
log = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
libc = "0.2"
parking_lot = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
android_logger = "0.14"
tun2proxy = { version = "0.8.7", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# Host-only workaround, see vendor/windows-link/Cargo.toml
windows-link = { path = "vendor/windows-link" }
